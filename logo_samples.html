/* ==========================================================================
   GLOBAL STYLE & THEME
   ========================================================================== */
*, *::before, *::after {

  padding: 0;
}

body {

.container {

/* ヘッダー */

}

.header h1 {

  font-weight: 900;
  color: #005B5C; /* 蒼テーマメイン */

}

.header p {

  margin-top: 0.35rem;
}

   ========================================================================== */
.simulator-section {
  background: white;
  border: 1px solid #E5E9E8;
  border-radius: 16px;
  padding: 1.5rem;
  margin-bottom: 3rem;
  box-shadow: 0 10px 30px rgba(0, 91, 92, 0.04);
}

.sim-title {
  font-size: 0.8rem;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.1em;

  margin-bottom: 1rem;
  display: block;

  padding: 1rem 1.5rem;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  transition: all 0.3s ease;
  min-height: 68px;
}

/* シミュレータの背景バリエーション */
.bg-ao {
  background: linear-gradient(135deg, #004D4E 0%, #005B5C 100%);
  border-bottom: 3px solid #C5A059;
  color: white;
}
.bg-white-theme {
  background: #FFFFFF;
  border-bottom: 2px solid #CBD5E1;
  color: #1F2937;
}
.bg-miyabi {
  background: linear-gradient(135deg, #D32F2F 0%, #1A237E 100%);
  border-bottom: 3px solid #E7E3DC;
  color: white;
}

.app-header-left {
  display: flex;
  align-items: center;
  gap: 0.85rem;
}

.app-header-logo-container {
  width: 36px;
  height: 36px;

  align-items: center;
  justify-content: center;

.app-header-logo-container svg {

  height: 100%;
}

.app-header-title h2 {
  font-size: 0.95rem;
  font-weight: 900;
  letter-spacing: -0.01em;
}

.app-header-title p {
  font-size: 0.62rem;
  opacity: 0.7;
  margin-top: 1px;
}

.sim-controls {
  display: flex;
  gap: 0.75rem;
  margin-top: 1.25rem;
  justify-content: center;
}

.sim-btn {
  border: 1px solid #CBD5E1;
  background-color: white;
  border-radius: 8px;
  padding: 6px 12px;
  font-size: 0.75rem;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.2s;
  color: #4A5568;
}

.sim-btn.active {
  background-color: #005B5C;
  color: white;
  border-color: #005B5C;
}

   🎨 LOGO GRID CATALOG (10選一覧)
   ========================================================================== */
.logo-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 1.5rem;
}

.logo-card {
  background: white;
  border: 1px solid #E5E9E8;
  border-radius: 16px;
  padding: 1.5rem;
  text-align: center;
  cursor: pointer;
  box-shadow: 0 4px 15px rgba(0,0,0,0.02);
  transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1rem;
}

.logo-card:hover {
  transform: translateY(-4px);
  box-shadow: 0 10px 25px rgba(0, 91, 92, 0.08);
  border-color: #005B5C;
}

.logo-card.selected {
  border-color: #C5A059; /* ゴールド */
  background-color: #FAF9F6;
  box-shadow: 0 8px 25px rgba(197, 160, 89, 0.12);
}

.logo-card-preview {
  width: 76px;
  height: 76px;
  display: flex;
  align-items: center;
  justify-content: center;
  background-color: #F8FAFC;
  border-radius: 12px;
  border: 1px solid #EDF2F7;
  padding: 8px;
  transition: all 0.2s;
}

.logo-card-info h3 {
  font-size: 0.85rem;
  font-weight: 800;
  color: #1F2937;
}

.logo-card-info p {
  font-size: 0.68rem;
  color: #6B7280;
  margin-top: 0.25rem;

  font-weight: 700;

.copy-btn:hover {
  background-color: #E2E8F0;

.copy-btn.copied {

// ==========================================================================
// RENDER LOGOS & ACTIONS
// ==========================================================================
let currentSelectedLogoId = "logo-chouchin";

document.addEventListener("DOMContentLoaded", () => {
  renderLogoGrid();
  selectLogo("logo-chouchin"); // デフォルト選択
});

function renderLogoGrid() {
  const container = document.getElementById("logo-grid-container");
  container.innerHTML = "";

  logoData.forEach(logo => {
    const card = document.createElement("div");
    card.className = `logo-card ${logo.id === currentSelectedLogoId ? 'selected' : ''}`;
    card.id = logo.id;
    card.onclick = () => selectLogo(logo.id);

    card.innerHTML = `
      <div class="logo-card-preview" id="preview-${logo.id}">
        ${logo.svg}
      </div>
      <div class="logo-card-info">
        <h3>${logo.name}</h3>
        <p>${logo.desc}</p>
        <p style="font-size:0.6rem; color:#6B7280; text-align:left; margin-top:6px; line-height:1.35;">${logo.explain}</p>
      </div>
      <button class="copy-btn" onclick="copySvgCode('${logo.id}', event)">📋 SVGをコピー</button>
    `;
    container.appendChild(card);
  });
}

// ロゴの選択とシミュレーターへの反映
function selectLogo(logoId) {
  currentSelectedLogoId = logoId;
  
  // カードの選択状態更新
  document.querySelectorAll(".logo-card").forEach(card => {
    card.classList.remove("selected");
  });
  const selectedCard = document.getElementById(logoId);
  if (selectedCard) selectedCard.classList.add("selected");

  // シミュレータへの反映
  const logoObj = logoData.find(logo => logo.id === logoId);
  const mockLogoArea = document.getElementById("mock-logo-area");
  
  if (logoObj && mockLogoArea) {
    mockLogoArea.innerHTML = logoObj.svg;
    
    // アニメーション効果を付与
    mockLogoArea.style.transform = "scale(0.8)";
    setTimeout(() => {
      mockLogoArea.style.transform = "scale(1)";
    }, 150);
  }
}

// シミュレータ背景色の変更
function changeMockBg(bgType, btn) {
  const mock = document.getElementById("header-mock");
  mock.className = "app-header-mock";
  mock.classList.add(`bg-${bgType}`);

  // コントロールボタンのアクティブ状態更新
  document.querySelectorAll(".sim-controls .sim-btn").forEach(b => {
    b.classList.remove("active");
  });
  btn.classList.add("active");
}

// ワンクリックコピペ機能
function copySvgCode(logoId, event) {
  event.stopPropagation(); // カードクリック（シミュレータ反映）を抑止
  
  const logoObj = logoData.find(logo => logo.id === logoId);
  if (!logoObj) return;

  const codeText = logoObj.svg;
  
  navigator.clipboard.writeText(codeText).then(() => {
    // トースト通知表示
    const toast = document.getElementById("toast-notify");
    toast.classList.add("show");
    setTimeout(() => {
      toast.classList.remove("show");
    }, 2000);

    // コピーボタンのテキストを一時変更
    const btn = event.target;
    const originText = btn.innerText;
    btn.innerText = "✓ コピー完了！";
    btn.classList.add("copied");
    setTimeout(() => {
      btn.innerText = originText;
      btn.classList.remove("copied");
    }, 1500);
  });
}
</script>
</body>
</html>
